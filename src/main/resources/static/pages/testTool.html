<!DOCTYPE html>
<html>
<head>
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="Cache-Control" content="no-cache, no-store">
<meta http-equiv="Expires" content="0">
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=EDGE">
<title>csf测试工具</title>
<meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <!-- Bootstrap 3.3.6 -->
    <link rel="stylesheet" href="lib/bootstrap/3.3.6/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="lib/font-awesome/4.7.0/css/font-awesome.css">
    <!-- AdminLTE Theme skin-blue  -->
    <link rel="stylesheet" href="lib/AdminLTE/css/AdminLTE.css">
   <!-- <link rel="stylesheet" href="lib/AdminLTE/css/jq22.css"> --> 
    <link rel="stylesheet" href="../api/css/buttons.css">
    <link rel="stylesheet" href="layui/css/layui.css" type="text/css">
    <link rel="stylesheet" href="layui/css/jsmind.css" type="text/css">
    <link rel="stylesheet" href="layui/layui_ext/dtree/dtree.css" type="text/css">
    <link rel="stylesheet" href="layui/layui_ext/dtree/font/dtreefont.css" type="text/css">
</head>
<body>
<div class="wrapper">
	<div class="row" id="Page_csfTestTool"> 
        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">入参条件</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse">
                        <i class="fa fa-minus"></i>
                    </button>
                </div>
            </div>
            <!-- /.box-header -->
            <form id="JS_csfTestToolForm">
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>csfCode</label>
                                <input type="text" class="form-control input-sm " name="csfCode" placeholder="请输入csfCode">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>调用环境</label>
                             <select name="zkList" class="form-control" id="zkList" required>
                            	<option value="cs">测试环境</option>
                            	<option value="zfb_sd">准发布三墩</option>
                            	<option value="zfb_sq">准发布石桥</option>
                            </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>调用区域</label>
                             <select name="regionId" class="form-control" id="regionId" required>
                            	<option value="571">二级云</option>
                            	<option value="573">一级云</option>
                            </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>参数类型</label>
                                <select name="paramType" class="form-control input-sm">
                                    <option value="">请选择</option>
                                    <option value="map">GW-map</option>
                                    <option value="json">json</option>
                                    <option value="String">String</option>
                                    <option value="MAP">hash-map</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label>请求报文</label>
                                <textarea placeholder="请输入报文" class="form-control" name="request" style="height: 220px; resize: none;" id="request"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /.box-body -->
                <div class="box-footer">
                    <div class=" text-center">
                        <button type="reset" class="btn btn-default">重置</button>
                        <button type="button" class="btn btn-primary" name="run">运行</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="box">
            <div class="box-header">
                <h3 class="box-title">
                   		 返回结果
                </h3>
                <div class="box-tools">
                    <form class="form-inline">
    
                        <button type="button" class="btn btn-box-tool" data-widget="collapse">
                            <i class="fa fa-minus"></i>
                        </button>
                    </form>
                </div>
            </div>
    
            <div class="box-body">
                <form name="JS_result">
                    <textarea placeholder="返回结果" class="form-control" style="height: 220px; resize: none;" name="csfResult" id="csfResult"></textarea>
                </form>
            </div>
        </div>
    </div>
 </div> 
<script src="lib/jquery/2.2.3/jquery.min.js"></script>
<script src="lib/jquery-ui.min.js"></script>
<script src="lib/bootstrap/3.3.6/js/bootstrap.min.js"></script>
<script src="lib/xsm-msgbox/0.2.0/js/xsm-msgbox.min.js"></script>
<script src="lib/rose/1.0.0/Rose.src.js"></script>
<script src="lib/seajs/sea.js"></script>
<script src="lib/seajs/sea-plugins.js"></script>
<script src="conf/config.js"></script>
<script type="text/javascript" src="layui/layui.all.js"></script>
<script type="text/javascript" src="layui/jsmind.draggable.js"></script>
<script type="text/javascript" src="layui/jsmind.js"></script>
<script type="text/javascript" src="layui/jsmind.screenshot.js"></script>
<script>
        seajs.use("script/devJs/testTool.js", function (init) {
            init.init();
        });
</script>
</body>
</html>
